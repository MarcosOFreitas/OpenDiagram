# Dependency updates. Security updates are configured in the repository settings and are not limited by this file.
# vite, vitest and the plugins around them move together: a major bump of one of them breaks `npm ci` on its own (peer dependencies), so majors are done by hand, in one change
# (vite 7 + vitest 5 on 2026-10-16, which also closed the @vitest/mocker security alert).
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      web-minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]
      - dependency-name: jsdom
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      server-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
