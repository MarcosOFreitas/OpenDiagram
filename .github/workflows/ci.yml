name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Server
        working-directory: server
        run: |
          npm ci
          node --check src/*.js
          npm test
          node test-lineage.mjs
      - name: Web
        working-directory: web
        run: |
          npm ci
          node lineage-check.mjs
          npm test
          npx vite build
