name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Server
        working-directory: server
        run: |
          npm ci
          node --check src/*.js
          npm test
          node test-lineage.mjs
      - name: Web
        working-directory: web
        run: |
          npm ci
          node lineage-check.mjs
          npm test
          npx vite build

  e2e:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: End-to-end (stack, e2e scripts, UI audit, behaviour fingerprint)
        run: bash .github/ci-e2e.sh
