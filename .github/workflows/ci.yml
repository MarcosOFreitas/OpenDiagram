name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['*.md', '.specs/**', LICENSE]  # root docs only: web/src/docsite/pages/*.md is part of the build
  pull_request:
    paths-ignore: ['*.md', '.specs/**', LICENSE]
  workflow_dispatch:

# a newer push to the same branch or PR cancels the run still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Server
        working-directory: server
        run: |
          npm ci
          node --check src/*.js
          npm test
          node test-lineage.mjs
      - name: Web
        working-directory: web
        run: |
          npm ci
          node lineage-check.mjs
          npm test
          npx vite build

  # ~25 min: runs on main and on demand (Actions -> ci -> Run workflow), not on every pull request
  e2e:
    needs: unit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: End-to-end (stack, e2e scripts, UI audit, behaviour fingerprint)
        run: bash .github/ci-e2e.sh
