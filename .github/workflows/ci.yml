name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['*.md', '.specs/**', LICENSE]  # root docs only: web/src/docsite/pages/*.md is part of the build
  pull_request:
    paths-ignore: ['*.md', '.specs/**', LICENSE]
  workflow_dispatch:

# least privilege: nothing here writes to the repository
permissions:
  contents: read

# a newer push to the same pull request cancels the run still going; a push to main is never cancelled, or its commit would stay unverified
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Server
        working-directory: server
        run: |
          npm ci
          node --check src/*.js
          npm test
          node test-lineage.mjs
      - name: Web
        working-directory: web
        run: |
          npm ci
          node lineage-check.mjs
          npm test
          npx vite build

  # The UI audit is ~85% of the end-to-end time (22 of 25 min): 4 shards, one runner each, ~8 min in all. Runs on main and on demand
  # (Actions -> ci -> Run workflow), not on every pull request. If branch protection ever requires "e2e", it is the job below, not the shards.
  e2e-shard:
    needs: unit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      UI_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: End-to-end (stack, e2e scripts on shard 1, UI audit of this shard, behaviour fingerprint on shard 1)
        run: bash .github/ci-e2e.sh

  e2e:
    needs: e2e-shard
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.e2e-shard.result }}" = success
