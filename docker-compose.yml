# OpenDiagram: the app only. Demo databases for trying the import and for the e2e scripts are in docker-compose.demo.yml.
#   docker compose up -d                      pulls the published image (OPENDIAGRAM_VERSION, default latest)
#   docker compose up -d --build              builds it from this clone instead
# The project name is fixed, so the data volume is always opendiagram_appdata whatever the folder is called.
name: opendiagram

services:
  app:
    image: ghcr.io/marcosoliveira-intelicity/opendiagram:${OPENDIAGRAM_VERSION:-latest}
    build: .
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      APP_SECRET: ${APP_SECRET:-}
      REQUIRE_APP_SECRET: ${REQUIRE_APP_SECRET:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-}
      DB_HOST_POLICY: ${DB_HOST_POLICY:-open}
      DB_HOST_ALLOWLIST: ${DB_HOST_ALLOWLIST:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      BACKUP_DIR: ${BACKUP_DIR:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-}
    # nothing but the data volume is written: a read-only root filesystem, and a small /tmp in memory
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    volumes: [appdata:/data]

volumes:
  appdata:
